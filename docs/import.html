<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MKW Web Port — Import</title>
<script src="coi-register.js"></script>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --line: #d9d9d4; --accent: #2f6fdb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ececea; --muted: #9a9a94; --line: #33332f; --accent: #6f9ef0; } }
  body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 16px; }
  button { font: inherit; padding: 8px 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--fg); color: var(--bg); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  progress { width: 100%; height: 10px; margin: 16px 0 4px; accent-color: var(--accent); }
  #status { font-variant-numeric: tabular-nums; }
  pre { margin-top: 16px; padding: 12px; border: 1px solid var(--line); border-radius: 6px; max-height: 260px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>Import game files into this browser</h1>
  <p>One-time step. Pick the folder containing your extracted Mario Kart Wii disc.
     Files are copied into this browser's private storage (OPFS). Already-copied files
     are skipped, so it can be re-run safely.</p>
  <button id="go">Pick game folder &amp; import</button>
  <progress id="bar" value="0" max="1"></progress>
  <div id="status">Idle.</div>
  <pre id="log"></pre>
</main>
<script type="module">
const $ = (id) => document.getElementById(id);
const log = (line) => { $('log').textContent += line + '\n'; $('log').scrollTop = 1e9; };
const mib = (n) => (n / 1048576).toFixed(1) + ' MiB';

const CONFIG_TOML = `[paths]
dvd_root = "/opfs/WiiCompiled/dvd"

[video]
window_width = 854
window_height = 480

[network]
enabled = false
`;

async function dirFor(root, parts) {
  let dir = root;
  for (const part of parts) dir = await dir.getDirectoryHandle(part, { create: true });
  return dir;
}

async function existingSize(dir, name) {
  try { return (await (await dir.getFileHandle(name)).getFile()).size; } catch { return -1; }
}

async function writeText(dir, name, text) {
  const writable = await (await dir.getFileHandle(name, { create: true })).createWritable();
  await writable.write(text);
  await writable.close();
}

async function collectFiles(dirHandle, prefix = '') {
  const files = [];
  for await (const [name, handle] of dirHandle) {
    const rel = prefix ? prefix + '/' + name : name;
    if (handle.kind === 'directory') {
      files.push(...await collectFiles(handle, rel));
    } else {
      const file = await handle.getFile();
      files.push({ path: rel, size: file.size, handle });
    }
  }
  return files;
}

$('go').onclick = async () => {
  $('go').disabled = true;
  const started = performance.now();
  try {
    if (!('showDirectoryPicker' in window)) {
      log('ERROR: This browser does not support the File System Access API.\nUse Chrome or Edge.');
      $('status').textContent = 'Not supported in this browser.';
      return;
    }

    const srcDir = await window.showDirectoryPicker({ mode: 'read' });
    log('scanning folder: ' + srcDir.name + '…');

    const files = await collectFiles(srcDir);
    const total = files.reduce((sum, f) => sum + f.size, 0);
    log(files.length + ' files, ' + mib(total) + ' total');

    const persisted = navigator.storage.persist ? await navigator.storage.persist() : false;
    const estimate = await navigator.storage.estimate();
    log('storage: persisted=' + persisted + ', quota ' + mib(estimate.quota) + ', used ' + mib(estimate.usage));

    const root = await navigator.storage.getDirectory();
    const userData = await dirFor(root, ['WiiCompiled']);

    let done = 0, copied = 0, skipped = 0;
    for (const entry of files) {
      const parts = entry.path.split('/');
      const name = parts.pop();
      const dir = await dirFor(userData, ['dvd', ...parts]);
      if (await existingSize(dir, name) === entry.size) {
        skipped++;
      } else {
        const file = await entry.handle.getFile();
        const writable = await (await dir.getFileHandle(name, { create: true })).createWritable();
        await writable.write(file);
        await writable.close();
        copied++;
      }
      done += entry.size;
      $('bar').value = done / total;
      $('status').textContent = mib(done) + ' / ' + mib(total) + ' — ' + copied + ' copied, ' + skipped + ' already present';
    }
    // Patch Config.toml to set dvd_root, preserving any other settings the game wrote.
    try {
      const configHandle = await userData.getFileHandle('Config.toml');
      let config = await (await configHandle.getFile()).text();
      if (config.includes('# dvd_root') || !config.includes('dvd_root = "/opfs')) {
        config = config.replace(/^#?\s*dvd_root\s*=.*$/m, 'dvd_root = "/opfs/WiiCompiled/dvd"');
        if (!config.includes('dvd_root = "/opfs')) {
          config += '\n[paths]\ndvd_root = "/opfs/WiiCompiled/dvd"\n';
        }
        await writeText(userData, 'Config.toml', config);
        log('patched Config.toml: dvd_root = /opfs/WiiCompiled/dvd');
      }
    } catch {
      await writeText(userData, 'Config.toml', CONFIG_TOML);
      log('wrote fresh Config.toml');
    }

    const seconds = ((performance.now() - started) / 1000).toFixed(1);
    log('Import finished in ' + seconds + ' s: ' + copied + ' copied, ' + skipped + ' skipped, ' + mib(total));
    $('status').textContent = 'Done! Go to play.html to start the game.';
  } catch (error) {
    if (error.name === 'AbortError') {
      $('status').textContent = 'Cancelled.';
      log('Folder picker cancelled.');
    } else {
      log('ERROR: ' + (error.stack || error));
      $('status').textContent = 'Import failed; see the log below.';
    }
  } finally {
    $('go').disabled = false;
  }
};
</script>
</body>
</html>
