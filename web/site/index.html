<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MKW Web Dev</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --line: #d9d9d4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ececea; --muted: #9a9a94; --line: #33332f; } }
  body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 20px; }
  ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); padding: 12px 0; }
  a { color: inherit; }
  code { font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>MKW web port — local dev server</h1>
  <p>Bound to 127.0.0.1 only. Isolation: <code id="iso">checking…</code></p>
  <ul>
    <li><a href="/gputest/gputest-pthread.html">GPU probe — pthread (target design)</a></li>
    <li><a href="/gputest/gputest-main.html">GPU probe — main thread (fallback)</a></li>
  </ul>
</main>
<script>
  document.getElementById('iso').textContent =
    (self.crossOriginIsolated ? 'crossOriginIsolated' : 'NOT isolated') +
    (typeof SharedArrayBuffer !== 'undefined' ? ', SharedArrayBuffer available' : ', no SharedArrayBuffer');
</script>
</body>
</html>
